<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Progress Components</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-5 text-center">Bootstrap Progress Components</h1>

    <!-- Basic Progress Bar -->
    <div class="section">
      <h2>Basic Progress Bar</h2>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 25%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 50%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 75%"></div>
        </div>
      </div>
    </div>

    <!-- Progress with Labels -->
    <div class="section">
      <h2>Progress with Labels</h2>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 25%">25%</div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 50%">50%</div>
        </div>
      </div>
    </div>

    <!-- Height Variations -->
    <div class="section">
      <h2>Height Variations</h2>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Example 1px high" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 1px">
          <div class="progress-bar" style="width: 25%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Example 5px high" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 5px">
          <div class="progress-bar" style="width: 25%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Example 20px high" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 20px">
          <div class="progress-bar" style="width: 25%"></div>
        </div>
      </div>
    </div>

    <!-- Colored Progress Bars -->
    <div class="section">
      <h2>Colored Progress Bars</h2>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar bg-success" style="width: 25%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Info example" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar bg-info" style="width: 50%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Warning example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar bg-warning" style="width: 75%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar bg-danger" style="width: 100%"></div>
        </div>
      </div>
    </div>

    <!-- Striped Progress Bars -->
    <div class="section">
      <h2>Striped Progress Bars</h2>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Default striped example" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar progress-bar-striped" style="width: 10%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Success striped example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar progress-bar-striped bg-success" style="width: 25%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Info striped example" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar progress-bar-striped bg-info" style="width: 50%"></div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Warning striped example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar progress-bar-striped bg-warning" style="width: 75%"></div>
        </div>
      </div>
    </div>

    <!-- Animated Striped Progress Bars -->
    <div class="section">
      <h2>Animated Striped Progress Bars</h2>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%"></div>
        </div>
      </div>
    </div>

    <!-- Multiple Progress Bars -->
    <div class="section">
      <h2>Multiple Progress Bars</h2>
      <div class="progress-container">
        <div class="progress" role="progressbar" aria-label="Multiple bars example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 15%">15%</div>
          <div class="progress-bar bg-success" style="width: 30%">30%</div>
          <div class="progress-bar bg-info" style="width: 20%">20%</div>
        </div>
      </div>
    </div>

    <!-- Custom Circular Progress Bars -->
    <div class="section">
      <h2>Custom Circular Progress Bars</h2>
      <div class="d-flex flex-wrap justify-content-center">
        <div class="text-center">
          <div class="progress circular" role="progressbar" aria-label="Circular progress" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar">
              <div class="circle-background"></div>
              <div class="circle-progress"></div>
              <div class="progress-label">25%</div>
            </div>
          </div>
          <div class="circular-title">Basic</div>
        </div>
        
        <div class="text-center">
          <div class="progress circular" role="progressbar" aria-label="Success circular progress" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar bg-success">
              <div class="circle-background"></div>
              <div class="circle-progress"></div>
              <div class="progress-label">50%</div>
            </div>
          </div>
          <div class="circular-title">Success</div>
        </div>
        
        <div class="text-center">
          <div class="progress circular" role="progressbar" aria-label="Danger circular progress" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar bg-danger">
              <div class="circle-background"></div>
              <div class="circle-progress"></div>
              <div class="progress-label">75%</div>
            </div>
          </div>
          <div class="circular-title">Danger</div>
        </div>
        
        <div class="text-center">
          <div class="progress circular" role="progressbar" aria-label="Info circular progress" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar bg-info">
              <div class="circle-background"></div>
              <div class="circle-progress"></div>
              <div class="progress-label">100%</div>
            </div>
          </div>
          <div class="circular-title">Info</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="circular-progress.js"></script>
</body>
</html>
